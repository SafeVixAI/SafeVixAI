name: Frontend CI

on:
  workflow_call:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [main]
    paths: ['frontend/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run tests (with flaky retry)
        working-directory: frontend
        run: |
          npm test -- --watchAll=false --coverage || {
            echo "::warning::Tests failed on first attempt, retrying..."
            npm test -- --watchAll=false --coverage || {
              echo "::error::Tests failed after retry"
              exit 1
            }
          }

      - name: Restore Next.js cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.2.3
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}

      - name: Build (no standalone — faster for CI verification)
        working-directory: frontend
        run: npm run build

  bundle-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Check bundle size
        working-directory: frontend
        run: |
          TOTAL_SIZE=$(du -sk .next/static/chunks 2>/dev/null | cut -f1)
          echo "Total bundle size: ${TOTAL_SIZE:-0}KB"
          if [ "${TOTAL_SIZE:-0}" -gt 15000 ]; then
            echo "⚠️ Bundle size exceeds 15MB threshold (${TOTAL_SIZE}KB)"
          fi


