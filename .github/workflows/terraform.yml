name: Terraform

on:
  push:
    branches: [main]
    paths: ['terraform/**', '.github/workflows/terraform.yml']
  pull_request:
    branches: [main]
    paths: ['terraform/**']


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_VERSION: 1.5.7
  AWS_REGION: ap-south-1

jobs:
  validate-commits:
    name: Validate Signed Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify HEAD commit is signed
        run: |
          COMMIT_SIGNATURE=$(git verify-commit HEAD 2>&1 || true)
          if echo "$COMMIT_SIGNATURE" | grep -q "gpg: Signature made"; then
            echo "HEAD commit is signed"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Skipping signed-commit check for pull_request"
          else
            echo "::warning::HEAD commit is NOT signed — skipping signed-commit check"
            echo "To enforce, set up GPG signing: https://docs.github.com/en/authentication/managing-commit-signature-verification/signing-commits"
          fi

  validate:
    needs: [validate-commits]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1.1.4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        continue-on-error: true
        working-directory: terraform
        run: terraform validate

      - name: Terraform security scan
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6  # v1.0.4
        with:
          working_directory: terraform
          additional_args: --format=json --no-colour
        continue-on-error: true

  plan:
    if: github.ref == 'refs/heads/main'
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1.1.4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        id: aws-config
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        if: steps.aws-config.outcome == 'success'
        working-directory: terraform
        run: terraform init

      - name: Terraform plan
        if: steps.aws-config.outcome == 'success'
        working-directory: terraform
        run: terraform plan -no-color -out=tfplan
        env:
          TF_VAR_db_master_password: ${{ secrets.TF_VAR_DB_MASTER_PASSWORD }}
          TF_VAR_domain_name: ${{ secrets.TF_VAR_DOMAIN_NAME }}
          TF_VAR_acm_certificate_arn: ${{ secrets.TF_VAR_ACM_CERTIFICATE_ARN }}
          TF_VAR_alert_email_recipients: ${{ secrets.TF_VAR_ALERT_EMAIL_RECIPIENTS }}

      - name: Upload plan
        if: steps.aws-config.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 30

  apply:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1.1.4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        id: aws-config-apply
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download plan
        if: steps.aws-config-apply.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4.6.1
        with:
          name: tfplan
          path: terraform

      - name: Terraform apply
        if: steps.aws-config-apply.outcome == 'success'
        working-directory: terraform
        run: terraform apply -no-color tfplan

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [validate-commits, validate, plan, apply]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'Terraform'
      job-name: apply
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

