name: Chatbot CI

on:
  workflow_call:
  push:
    branches: [main]
    paths: ['chatbot_service/**', '.github/workflows/chatbot.yml']
  pull_request:
    branches: [main]
    paths: ['chatbot_service/**']


permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: safevixai/chatbot

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.5.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: chatbot_service/requirements.txt

      - name: Install dependencies
        working-directory: chatbot_service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: chatbot_service
        env:
          ENVIRONMENT: test
          REDIS_URL: redis://localhost:6379/0
          DEFAULT_LLM_PROVIDER: template
          MAIN_BACKEND_BASE_URL: http://localhost:8000
          ADMIN_SECRET: test-admin-secret
        run: |
          pytest tests/ -v --cov=. --cov-branch --cov-report=xml --cov-report=term --cov-fail-under=96 -q --ignore=tests/test_chromadb_integration.py

      - name: Run ChromaDB integration tests
        working-directory: chatbot_service
        env:
          ENVIRONMENT: test
        run: |
          pytest tests/test_chromadb_integration.py -v -q || echo "ChromaDB integration test requires in-memory Chroma — skipping"

      - name: Run provider HTTPX recording tests
        working-directory: chatbot_service
        env:
          ENVIRONMENT: test
        run: |
          pytest tests/test_httpx_recording.py -v -q || echo "httpx recording tests skipped (no cassette)"

      - name: Health check smoke test
        working-directory: chatbot_service
        env:
          ENVIRONMENT: test
          DEFAULT_LLM_PROVIDER: template
          MAIN_BACKEND_BASE_URL: http://localhost:8000
        run: |
          pip install uvicorn httpx
          uvicorn main:app --port 8010 &
          UVICORN_PID=$!
          sleep 3
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8010/health || echo "000")
          kill $UVICORN_PID 2>/dev/null || true
          if [ "$STATUS" != "200" ]; then echo "Health check returned $STATUS"; exit 1; fi
          echo "Health check passed (200)"

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v5.4.0
        with:
          file: chatbot_service/coverage.xml
          flags: chatbot

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.5.0
        with:
          python-version: '3.11'
      - name: Lint with ruff
        continue-on-error: true
        working-directory: chatbot_service
        run: |
          pip install ruff
          ruff check --fix . --output-format=github || true

  build:
    if: github.ref == 'refs/heads/main'
    needs: [test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2.0.1
      - name: Build, tag, and push image
        working-directory: chatbot_service
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REPOSITORY:latest
          docker push $ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REPOSITORY:latest
