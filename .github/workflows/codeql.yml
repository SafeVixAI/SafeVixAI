name: CodeQL Analysis

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'chatbot_service/**'
      - 'frontend/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'chatbot_service/**'
      - 'frontend/**'
      - 'scripts/**'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07  # v3.28.16
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          source-root: ${{ matrix.language == 'javascript-typescript' && 'frontend' || '.' }}

      - name: Check analysis results
        if: always()
        run: echo "CodeQL analysis completed for ${{ matrix.language }}"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07  # v3.28.16
        with:
          category: /language:${{ matrix.language }}
