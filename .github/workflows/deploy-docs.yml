name: Deploy Enterprise Docs
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-commits:
    name: Validate Signed Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify HEAD commit is signed
        run: |
          COMMIT_SIGNATURE=$(git verify-commit HEAD 2>&1 || true)
          if echo "$COMMIT_SIGNATURE" | grep -q "gpg: Signature made"; then
            echo "HEAD commit is signed"
          else
            echo "::warning::HEAD commit is NOT signed — skipping signed-commit check"
            echo "To enforce, set up GPG signing: https://docs.github.com/en/authentication/managing-commit-signature-verification/signing-commits"
          fi

  deploy:
    needs: [validate-commits]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.5.0
        with:
          python-version: '3.11'

      - name: Install MkDocs Material
        run: pip install -r mkdocs-requirements.txt

      - name: Inject Root Documents
        run: |
          for src in README.md SETUP.md DESIGN.md AGENTS.md SKILL.md; do
            [ -f "$src" ] && cp "$src" "docs/$src" || echo "Warning: $src not found"
          done
          [ -f backend/openapi.json ] && cp backend/openapi.json docs/backend.json || echo "Warning: backend/openapi.json not found"
          [ -f chatbot_service/openapi.json ] && cp chatbot_service/openapi.json docs/chatbot.json || echo "Warning: chatbot_service/openapi.json not found"

      - name: Generate Docs Health Dashboard
        run: python scripts/docs/generate-health-dashboard.py || true

      - name: Generate PDF export
        continue-on-error: true
        run: |
          MKDOCS_EXPORTER_PDF=true mkdocs build --clean 2>&1 || echo "PDF export skipped (plugin may be unavailable)"
        env:
          MKDOCS_EXPORTER_PDF: "true"

      - name: Generate API Changelog
        run: python scripts/docs/generate-api-changelog.py || true

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Deploy versioned docs (mike)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mike deploy --push --update-aliases --init ${{ steps.version.outputs.version }} latest 2>&1 || echo "mike deploy skipped"
        env:
          PLAUSIBLE_DOMAIN: ${{ secrets.PLAUSIBLE_DOMAIN || '' }}
          PLAUSIBLE_SRC: ${{ secrets.PLAUSIBLE_SRC || '' }}

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [validate-commits, deploy]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'Deploy Enterprise Docs'
      job-name: deploy
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

