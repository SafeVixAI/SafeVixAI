name: Notify Failure

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      workflow-name:
        required: true
        type: string
      job-name:
        required: true
        type: string
      run-id:
        required: true
        type: number
      conclusion:
        required: true
        type: string
    secrets:
      SLACK_WEBHOOK:
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify via Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          WORKFLOW_NAME: ${{ inputs.workflow-name }}
          JOB_NAME: ${{ inputs.job-name }}
          RUN_ID: ${{ inputs.run-id }}
          CONCLUSION: ${{ inputs.conclusion }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "No SLACK_WEBHOOK configured — skipping notification"
            exit 0
          fi
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"[$REPO] *$WORKFLOW_NAME*: \`$JOB_NAME\" job *$CONCLUSION*.\\nRun ID: $RUN_ID\\nURL: https://github.com/$REPO/actions/runs/$RUN_ID\"}" \
            "$SLACK_WEBHOOK" || echo "Slack notification failed (non-blocking)"
