name: Update Master Document

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'chatbot_service/**'
      - 'frontend/**'
      - 'docs/*.md'
      - 'scripts/docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'SETUP.md'
      - 'DESIGN.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          fetch-depth: 0

      - name: Warmup production endpoints
        continue-on-error: true
        run: |
          curl -sfI https://safevixai-api.onrender.com/health || echo "Backend not ready yet"
          curl -sfI https://safevixai-chatbot.onrender.com/health || echo "Chatbot not ready yet"
          curl -sfI https://safevixai.vercel.app || echo "Frontend not ready yet"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.5.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade requests python-docx

      - name: Update master document
        run: python scripts/docs/update_master_doc.py
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BACKEND_HEALTH_URL: https://safevixai-api.onrender.com/health
          CHATBOT_HEALTH_URL: https://safevixai-chatbot.onrender.com/health
          FRONTEND_URL: https://safevixai.vercel.app
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1.0.8.1.1
        with:
          commit-message: "docs: auto-update master doc"
          title: "docs: Auto-update Master Document"
          body: "Automated update of SafeVixAI_MASTER.docx with live repository statistics and alerting metrics."
          branch: "docs-auto-update"
          base: "main"
          add-paths: "docs/SafeVixAI_MASTER.docx"

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [update]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'Update Master Document'
      job-name: update
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

