name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.parse.outputs.version }}
      channel: ${{ steps.parse.outputs.channel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          fetch-depth: 0

      - name: Parse tag
        id: parse
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          if [[ "$TAG" == *"-"* ]]; then
            echo "channel=prerelease" >> $GITHUB_OUTPUT
          else
            echo "channel=stable" >> $GITHUB_OUTPUT
          fi

      - name: Validate VERSION file matches tag
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '\n\r')
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: VERSION file ($FILE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

  test:
    name: Test Suite
    needs: [validate]
    timeout-minutes: 30
    uses: ./.github/workflows/backend.yml
    secrets: inherit

  lint:
    name: Lint & Type Check
    needs: [validate]
    timeout-minutes: 30
    uses: ./.github/workflows/frontend.yml
    secrets: inherit

  sbom:
    name: Generate SBOM
    needs: [validate]
    timeout-minutes: 30
    uses: ./.github/workflows/security.yml
    secrets: inherit

  license-scan:
    name: License Compliance Check
    needs: [validate]
    timeout-minutes: 30
    uses: ./.github/workflows/license-scan.yml
    secrets: inherit

  build:
    name: Build & Push Images
    needs: [validate, test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    strategy:
      matrix:
        service:
          - { name: backend, context: backend, dockerfile: backend/Dockerfile }
          - { name: chatbot, context: chatbot_service, dockerfile: chatbot_service/Dockerfile }
          - { name: frontend, context: frontend, dockerfile: frontend/Dockerfile.frontend }
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.15.0
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018  # v1.6.0
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  sign:
    name: Sign Container Images
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        name: [backend, chatbot, frontend]
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3.8.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO}/${{ matrix.name }}" >> $GITHUB_OUTPUT

      - name: Sign image with cosign keyless
        run: |
          cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ github.ref }}" \
            -a "sha=${{ github.sha }}" \
            "${{ steps.tag.outputs.image }}:v${{ needs.validate.outputs.version }}"

      - name: Verify signature
        run: |
          cosign verify --insecure-ignore-tlog \
            "${{ steps.tag.outputs.image }}:v${{ needs.validate.outputs.version }}"

  create-release:
    name: Create GitHub Release
    needs: [validate, build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Generate release notes
        id: notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const version = '${{ needs.validate.outputs.version }}';
            const section = changelog.match(
              new RegExp(`## \\[${version}\\] - [\\d-]+\\n\\n([\\s\\S]*?)(?=\\n## \\[|\\n\\[Unreleased\\])`)
            );
            return section ? section[1].trim() : 'See CHANGELOG.md for details.';

      - name: Download SBOM artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.6.1
        with:
          path: sbom-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.2.1
        with:
          name: v${{ needs.validate.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.result }}
          files: |
            sbom-artifacts/**/*
          prerelease: ${{ needs.validate.outputs.channel == 'prerelease' }}
          generate_release_notes: false
