# SLSA Provenance attestation for release artifacts
name: SLSA Provenance

on:
  workflow_call:
    inputs:
      artifact-path:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
  workflow_dispatch:

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Generate SLSA3 provenance
        uses: slsa-framework/slsa-github-generator@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a  # v2.1.0
        with:
          artifact-source: "${{ inputs.artifact-path || github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          artifact-name: "${{ inputs.artifact-name || 'release-artifacts' }}"

  container-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      id-token: write
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest container provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018  # v1.6.0
        with:
          subject-path: ghcr.io/${{ github.repository }}/*

      - name: Verify attestation
        run: |
          gh attestation verify \
            --repo ${{ github.repository }} \
            ghcr.io/${{ github.repository }}/backend:latest 2>&1 | head -5
