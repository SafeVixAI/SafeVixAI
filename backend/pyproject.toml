[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safevixai-backend"
version = "1.0.0"
description = "SafeVixAI Backend — FastAPI + PostGIS emergency locator, challan calculator, road reporter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "SafeVixAI Team", email = "safevixai@googlegroups.com" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Framework :: FastAPI",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "EM", "G", "PIE", "T20"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "B017", "EM", "SIM", "N806", "N817", "F841", "B007", "E741", "PIE810", "E402", "F401", "B011", "C408", "N802", "W291", "T201"]
"scripts/*" = ["T201", "EM101", "EM102", "W291", "W293", "E402", "G004", "F821"]
"migrations/*" = ["T201", "EM101", "EM102", "W291", "W293", "E402", "E741", "ARG001"]
# FastAPI routes: request/current_user args required by decorators even when unused
"api/*" = ["ARG001"]
# Services: some unused args are part of interface contracts
"services/*" = ["ARG001"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore::DeprecationWarning:slowapi",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "scripts/*",
]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 93

[tool.mutmut]
paths_to_exclude = ["tests/", "migrations/", "scripts/"]
paths_to_infect = ["core/", "services/", "api/v1/", "models/", "middleware/"]
backup = false
runner = "pytest tests/ -q --no-header"
dict_sync = false
