name: Frontend CI

on:
  workflow_call:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [main]
    paths: ['frontend/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run tests (with flaky retry)
        working-directory: frontend
        run: |
          npm test -- --watchAll=false --coverage || {
            echo "::warning::Tests failed on first attempt, retrying..."
            npm test -- --watchAll=false --coverage || {
              echo "::error::Tests failed after retry"
              exit 1
            }
          }

      - name: Restore Next.js cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v4.2.3
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}

      - name: Build (no standalone — faster for CI verification)
        working-directory: frontend
        run: npm run build

  bundle-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Check bundle size
        working-directory: frontend
        run: |
          TOTAL_SIZE=$(du -sk .next/static/chunks 2>/dev/null | cut -f1)
          echo "Total bundle size: ${TOTAL_SIZE:-0}KB"
          if [ "${TOTAL_SIZE:-0}" -gt 15000 ]; then
            echo "⚠️ Bundle size exceeds 15MB threshold (${TOTAL_SIZE}KB)"
          fi

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [test, bundle-check]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'Frontend CI'
      job-name: test
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}


