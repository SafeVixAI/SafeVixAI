name: Migration Safety Check

on:
  push:
    branches: [main]
    paths: ['backend/migrations/versions/**', 'backend/models/**']
  pull_request:
    branches: [main]
    paths: ['backend/migrations/versions/**', 'backend/models/**']
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: safevixai_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install alembic

      - name: Run alembic check
        working-directory: backend
        continue-on-error: true
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/safevixai_migration_test
          ENVIRONMENT: test
          ADMIN_SECRET: migration-check-secret
        run: |
          alembic upgrade head 2>&1
          echo "---"
          alembic check 2>&1 || echo "Migration check completed"

      - name: Verify downgrade cycle
        working-directory: backend
        continue-on-error: true
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/safevixai_migration_test
          ENVIRONMENT: test
          ADMIN_SECRET: migration-check-secret
        run: |
          CURRENT_BEFORE=$(alembic current 2>&1)
          echo "Current before downgrade: $CURRENT_BEFORE"
          alembic downgrade -1 2>&1 && echo "Downgrade successful" || echo "Downgrade skipped (base)"
          alembic upgrade head 2>&1 && echo "Re-upgrade successful"
          CURRENT_AFTER=$(alembic current 2>&1)
          echo "Current after cycle: $CURRENT_AFTER"
          if [ "$CURRENT_BEFORE" != "$CURRENT_AFTER" ]; then
            echo "⚠️ Migration head mismatch after downgrade/upgrade cycle"
          fi

      - name: Verify no duplicate revision IDs
        working-directory: backend
        run: |
          DUPS=$(python -c "
import re,os
versions = os.path.join('migrations', 'versions')
ids = []
for f in os.listdir(versions):
    if f.endswith('.py') and f != '__init__.py':
        with open(os.path.join(versions, f)) as fh:
            m = re.search(r'revision\s*=\s*['\"]([^'\"]+)['\"]', fh.read())
            if m: ids.append(m.group(1))
dup = [i for i in ids if ids.count(i) > 1]
if dup: print(f'DUPLICATE: {dup}'); exit(1)
print(f'All {len(ids)} revision IDs unique')
")
          echo "$DUPS"
