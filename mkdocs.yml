site_name: SafeVixAI
site_description: Enterprise AI-Powered Road Safety Platform Documentation
site_url: https://safevixai.github.io/SafeVixAI/
site_author: SafeVixAI Team
repo_url: https://github.com/SafeVixAI/SafeVixAI
repo_name: SafeVixAI/SafeVixAI

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      lang: en
      separator: '[\s\-_]+'
  - swagger-ui-tag:
      background: "#009688"
  - glossary:
      unknown_warning: false
  - exporter:
      formats:
        pdf:
          enabled: !ENV [MKDOCS_EXPORTER_PDF, false]
          concurrency: 4
          aggregator:
            enabled: true
            output: .well-known/safevixai-docs.pdf
            covers: all

# ── Multi-language (i18n) ─────────────────────────────────────────
# Uncomment to enable Indian language docs. Requires translated content.
# See: https://ultrabug.fr/mkdocs-static-i18n
#
# plugins:
#   - i18n:
#       default_language: en
#       docs_structure: suffix
#       languages:
#         en: English
#         hi: Hindi
#         ta: Tamil
#         te: Telugu
#         bn: Bengali
#         mr: Marathi
#         gu: Gujarati

hooks:
  - docs/hooks/analytics.py

extra:
  analytics:
    provider: custom
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            using our <a href="https://github.com/SafeVixAI/SafeVixAI/issues/new?template=feedback.yml" target="_blank" rel="noopener">feedback form</a>.

extra_javascript:
  - javascripts/feedback.js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: sandbox
          class: sandbox
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: interactive
          class: interactive
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - abbr

