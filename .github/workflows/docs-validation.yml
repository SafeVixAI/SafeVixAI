name: Documentation Validation

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.markdownlint.json'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.markdownlint.json'

jobs:
  validate-markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@510b996878fc0d1a46c8a04ec86b06dbfba09de7 # v15
        with:
          globs: "**/*.md"

  validate-links:
    name: Broken Link Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Link Checker
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621 # v1.10.0
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  validate-mermaid:
    name: Mermaid Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli
      - name: Validate Mermaid Diagrams
        run: |
          echo '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' > puppeteer-config.json
          find . -name "*.md" -type f -not -path "*/node_modules/*" -not -path "*/.next/*" | while read file; do
            if grep -q "\`\`\`mermaid" "$file"; then
              echo "Validating mermaid in $file"
              mmdc -p puppeteer-config.json -i "$file" -o "${file%.md}.svg" || exit 1
              rm -f "${file%.md}"*.svg
            fi
          done

  build-mkdocs:
    name: MkDocs Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install MkDocs Dependencies
        run: |
          pip install mkdocs-material mkdocs
          if [ -f "mkdocs-requirements.txt" ]; then pip install -r mkdocs-requirements.txt; fi
      - name: Build Docs
        run: mkdocs build
