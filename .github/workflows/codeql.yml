name: CodeQL Analysis

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'chatbot_service/**'
      - 'frontend/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'chatbot_service/**'
      - 'frontend/**'
      - 'scripts/**'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v3.28.16
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          source-root: ${{ matrix.language == 'javascript-typescript' && 'frontend' || '.' }}

      - name: Check analysis results
        if: always()
        run: echo "CodeQL analysis completed for ${{ matrix.language }}"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v3.28.16
        with:
          category: /language:${{ matrix.language }}
