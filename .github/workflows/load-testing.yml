name: Load Testing

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-load:
    name: Backend Load Test
    runs-on: ubuntu-latest

    if: github.repository == 'SafeVixAI/SafeVixAI'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Run k6 load test
        uses: grafana/k6-action@e4714b734f2b0afaabeb7b4a69142745548ab9ec  # v0.3.1
        with:
          filename: tests/load/backend_api_load.js
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://safevixai.onrender.com' }}

  frontend-load:
    name: Frontend Load Test
    runs-on: ubuntu-latest

    if: github.repository == 'SafeVixAI/SafeVixAI'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Run k6 load test
        uses: grafana/k6-action@e4714b734f2b0afaabeb7b4a69142745548ab9ec  # v0.3.1
        with:
          filename: tests/load/frontend_load.js
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://safevixai.vercel.app' }}

  chatbot-load:
    name: Chatbot Load Test
    runs-on: ubuntu-latest

    if: github.repository == 'SafeVixAI/SafeVixAI'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Run k6 load test
        uses: grafana/k6-action@e4714b734f2b0afaabeb7b4a69142745548ab9ec  # v0.3.1
        with:
          filename: tests/load/chatbot_api_load.js
        env:
          CHATBOT_URL: ${{ secrets.CHATBOT_URL || 'https://safevixai-chatbot.onrender.com' }}

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [backend-load, frontend-load, chatbot-load]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'Load Testing'
      job-name: chatbot-load
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

