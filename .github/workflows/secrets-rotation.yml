name: Secrets Rotation

on:
  schedule:
    - cron: '0 2 1 * *' # First day of every month at 2 AM UTC
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to rotate (backend, chatbot, infra)'
        required: false
        default: ''
      key:
        description: 'Specific key to rotate'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  rotate:
    runs-on: ubuntu-latest

    if: github.repository == 'SafeVixAI/SafeVixAI'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.5.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install PyYAML

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Rotate secrets
        run: |
          args="--ci"
          if [ -n "${{ github.event.inputs.service }}" ]; then
            args="$args --service ${{ github.event.inputs.service }}"
          fi
          if [ -n "${{ github.event.inputs.key }}" ]; then
            args="$args --key ${{ github.event.inputs.key }}"
          fi
          python scripts/rotate-secrets.py $args

      - name: Upload rotation log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: rotation-log
          path: rotation-log-*.json
          retention-days: 90

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [rotate]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'Secrets Rotation'
      job-name: rotate
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

