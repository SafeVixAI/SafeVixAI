# SLSA Provenance attestation for release artifacts
name: SLSA Provenance

on:
  workflow_call:
    inputs:
      artifact-path:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate SLSA3 provenance
        uses: slsa-framework/slsa-github-generator@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a  # v2.1.0
        with:
          artifact-source: "${{ inputs.artifact-path || github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          artifact-name: "${{ inputs.artifact-name || 'release-artifacts' }}"

  container-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      id-token: write
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest container provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v1.6.0
        with:
          subject-path: ghcr.io/${{ github.repository }}/*

      - name: Verify attestation
        run: |
          gh attestation verify \
            --repo ${{ github.repository }} \
            ghcr.io/${{ github.repository }}/backend:latest 2>&1 | head -5

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [attest, container-attest]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'SLSA Provenance'
      job-name: container-attest
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

