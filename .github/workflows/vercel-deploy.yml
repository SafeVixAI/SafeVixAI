name: Vercel Deploy

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types:
      - completed

permissions:
  contents: read
  deployments: write

concurrency:
  group: vercel-deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  validate-commits:
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Verify commits are signed
        run: |
          UNSIGNED=$(git log --format='%H %G?' -1 | grep -v ' G$' | wc -l)
          if [ "$UNSIGNED" -gt 0 ]; then
            echo "::warning::HEAD commit is not signed — skipping signed-commit check"
            echo "To enforce, set up GPG signing: https://docs.github.com/en/authentication/managing-commit-signature-verification/signing-commits"
          fi
          echo "✅ HEAD commit is signed"

  deploy:
    needs: [validate-commits]
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    outputs:
      validated_sha: ${{ steps.validate.outputs.validated_sha }}
    steps:
      - name: Validate workflow payload
        id: validate
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -z "$HEAD_SHA" ]; then
            echo "Missing head_sha in workflow_run payload" >&2
            exit 1
          fi
          if ! echo "$HEAD_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "Invalid head_sha format: $HEAD_SHA" >&2
            exit 1
          fi
          echo "validated_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "head_branch=$HEAD_BRANCH"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4  # v42.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

  deploy-preview:
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate workflow payload
        id: validate
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$HEAD_SHA" ]; then
            echo "Missing head_sha in workflow_run payload" >&2
            exit 1
          fi
          if ! echo "$HEAD_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "Invalid head_sha format: $HEAD_SHA" >&2
            exit 1
          fi
          echo "validated_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to Vercel (Preview)
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4  # v42.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [validate-commits, deploy, deploy-preview]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'Vercel Deploy'
      job-name: deploy
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
