[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safevixai-chatbot"
version = "1.0.0"
description = "SafeVixAI Chatbot Service — Agentic RAG chatbot with 9-provider LLM fallback chain"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "SafeVixAI Team", email = "safevixai@googlegroups.com" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Framework :: FastAPI",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "EM", "G", "PIE", "T20"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "B017", "EM", "SIM", "N806", "N817", "F841", "B007", "E741", "PIE810", "E402", "F401", "B011", "C408", "N802", "W291", "T201"]
"scripts/*" = ["T201", "EM101", "EM102", "W291", "W293", "E402", "G004", "F821"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", "conftest.py", "fix.py", "recover.py", "alert_service.py", "memory/tiered_memory.py", "memory/user_memory.py", "core/pii.py", "rag/evaluation.py", "scripts/*", "prompts/*"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 100

[tool.mutmut]
paths_to_exclude = ["tests/", "migrations/", "scripts/"]
paths_to_infect = ["agent/", "providers/", "rag/", "tools/", "services/", "memory/"]
backup = false
runner = "pytest tests/ -q --no-header"
dict_sync = false
