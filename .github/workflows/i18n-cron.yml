name: Automated Weekly i18n Translation Sync

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  push:
    paths:
      - 'frontend/public/offline-data/translations/en.json'
      - 'frontend/i18n/locales/en/**'
  pull_request:
    paths:
      - 'frontend/public/offline-data/translations/en.json'
      - 'frontend/i18n/locales/en/**'
  workflow_dispatch:
    # Allow manual triggering of the translation generation pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  i18n-translate:
    name: Generate & Sync AI Translations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.5.0
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node.js dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Split monolithic translations into namespaces
        working-directory: ./frontend
        run: npm run i18n:split

      - name: Run AI translation script
        run: |
          echo "=== Generating AI Translations ==="
          python frontend/scripts/generate-ai-translations.py

      - name: Generate TypeScript type interfaces
        working-directory: ./frontend
        run: npm run i18n:types

      - name: Run key parity checks
        working-directory: ./frontend
        run: npm run lint:i18n

      - name: Create Pull Request for Translation Updates
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7.0.7
        with:
          commit-message: "i18n: auto-update localized target translations [automated]"
          title: "i18n: Auto-Sync Localized Target Translations"
          body: |
            Automated translation synchronization and key verification updates.
            
            This pull request synchronizes the monolithic `en.json` file, splits it into namespace files, runs `generate-ai-translations.py` to compile translation targets, updates TypeScript type definitions, and executes verification tests to ensure parity.
          branch: "i18n-auto-translations-sync-${{ github.run_id }}"
          base: "main"
          add-paths: |
            frontend/i18n/locales/**
            frontend/public/offline-data/translations/**

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [i18n-translate]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'Automated Weekly i18n Translation Sync'
      job-name: i18n-translate
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

