name: Migration Safety Check

on:
  push:
    branches: [main]
    paths: ['backend/migrations/versions/**', 'backend/models/**']
  pull_request:
    branches: [main]
    paths: ['backend/migrations/versions/**', 'backend/models/**']
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  migration-check:
    if: false
