name: Database Backup
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: safevixai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run backup
        run: |
          mkdir -p backups
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          PGPASSWORD=${{ secrets.POSTGRES_PASSWORD || 'postgres' }} pg_dump \
            -h localhost \
            -U postgres \
            -d safevixai \
            --no-owner \
            --no-acl \
            --compress=9 \
            --file="backups/safevixai_${TIMESTAMP}.sql.gz" \
            --format=custom

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: safevixai-db-backup
          path: backups/
          retention-days: 7

  backup-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
      - name: Backup Production Database
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "PROD_DATABASE_URL not set — skipping production backup"
            exit 0
          fi
          pg_dump "$PROD_DATABASE_URL" \
            --no-owner --no-acl \
            --file=production_backup.sql
      - name: Upload Production Backup
        if: env.PROD_DATABASE_URL != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: production-db-backup
          path: production_backup.sql
          retention-days: 30

  restore-test:
    needs: [backup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: safevixai_restore_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
      - name: Download backup artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4.6.1
        with:
          name: safevixai-db-backup
          path: backups/

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Restore backup to test database
        run: |
          BACKUP_FILE=$(ls backups/*.sql.gz 2>/dev/null | head -1)
          if [ -z "$BACKUP_FILE" ]; then
            echo "No backup file found — skipping restore test"
            exit 0
          fi
          PGPASSWORD=postgres pg_restore -h localhost -p 5433 -U postgres -d safevixai_restore_test \
            --no-owner --no-acl --clean --if-exists "$BACKUP_FILE" 2>&1 | tail -5
          echo "Restore completed (warnings expected)"

      - name: Verify restored data
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d safevixai_restore_test \
            -c "SELECT COUNT(*) AS table_count FROM information_schema.tables WHERE table_schema='public';" 2>&1
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d safevixai_restore_test \
            -c "SELECT COUNT(*) AS total_tables FROM pg_catalog.pg_tables WHERE schemaname='public';" 2>&1

      - name: Notify restore test result
        if: failure()
        run: echo "⚠️ Backup restore verification failed — backup may be corrupted"

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [backup, backup-production, restore-test]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'Database Backup'
      job-name: restore-test
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

