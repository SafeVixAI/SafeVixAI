# deploy/otel-collector-config.yaml
# OpenTelemetry Collector config for SafeVixAI production
# Deploy as sidecar alongside backend (port 8000) and chatbot (port 8010)
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  attributes:
    actions:
      - key: environment
        value: production
        action: upsert
      - key: service.namespace
        value: SafeVixAI
        action: upsert
  filter:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.target"] == "/health"'
        - 'attributes["http.target"] == "/metrics"'

exporters:
  otlp:
    endpoint: "${OTLP_ENDPOINT}"
    headers:
      Authorization: "Basic ${OTLP_AUTH_TOKEN}"
    tls:
      insecure: false
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: safevixai
    resource_to_telemetry_conversion:
      enabled: true
  logging:
    loglevel: warn

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes, filter]
      exporters: [otlp, logging]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [prometheus, otlp]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [otlp]
