name: Benchmark Regression

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  benchmark:
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '/benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate PR context
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No issue/PR number found" >&2
            exit 1
          fi
          # Verify commenter has write access to the repo
          PERMISSION=$(gh api "repos/${{ github.repository }}/collaborators/$COMMENT_USER/permission" --jq '.permission' 2>/dev/null || echo "none")
          if [ "$PERMISSION" != "admin" ] && [ "$PERMISSION" != "write" ]; then
            echo "User '$COMMENT_USER' does not have write access (permission: $PERMISSION)" >&2
            exit 1
          fi
          echo "PR #$ISSUE_NUMBER validated (commenter: $COMMENT_USER, permission: $PERMISSION)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.5.0
        with:
          python-version: '3.11'

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Measure frontend build time
        id: frontend-build
        working-directory: frontend
        run: |
          START=$(date +%s%N)
          npm run build 2>&1 | tail -5
          END=$(date +%s%N)
          DURATION_MS=$(( (END - START) / 1000000 ))
          echo "duration=$DURATION_MS" >> $GITHUB_OUTPUT
          echo "Frontend build: $(( DURATION_MS / 1000 ))s $(( DURATION_MS % 1000 ))ms"

      - name: Measure backend import time
        id: backend-import
        working-directory: backend
        run: |
          START=$(date +%s%N)
          python -c "import sys; sys.path.insert(0,'.'); from main import create_app; print('Backend imports OK')"
          END=$(date +%s%N)
          DURATION_MS=$(( (END - START) / 1000000 ))
          echo "duration=$DURATION_MS" >> $GITHUB_OUTPUT
          echo "Backend import: $(( DURATION_MS / 1000 ))s $(( DURATION_MS % 1000 ))ms"

      - name: Measure frontend test time
        id: frontend-tests
        working-directory: frontend
        run: |
          START=$(date +%s%N)
          npx jest --no-coverage --passWithNoTests 2>&1 | tail -2
          END=$(date +%s%N)
          DURATION_MS=$(( (END - START) / 1000000 ))
          echo "duration=$DURATION_MS" >> $GITHUB_OUTPUT

      - name: Post benchmark results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const lines = [
              '## Benchmark Results',
              '| Metric | Duration |',
              '|--------|----------|',
              '| Frontend Build | ${{ steps.frontend-build.outputs.duration }} ms |',
              '| Backend Import | ${{ steps.backend-import.outputs.duration }} ms |',
              '| Frontend Tests | ${{ steps.frontend-tests.outputs.duration }} ms |',
              '',
              '> Triggered by `/benchmark` on PR #${{ github.event.issue.number }}',
              '> Commit: ${{ github.sha }}',
            ];
            const body = lines.join('\n');
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            } catch (error) {
              core.warning('Failed to post benchmark comment: ' + error.message);
            }

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [benchmark]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'Benchmark Regression'
      job-name: benchmark
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

