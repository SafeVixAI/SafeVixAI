name: Docker Build & Scan

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/Dockerfile'
      - 'chatbot_service/Dockerfile'
      - 'frontend/Dockerfile.frontend'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'backend/Dockerfile'
      - 'chatbot_service/Dockerfile'
      - 'frontend/Dockerfile.frontend'
      - '.github/workflows/docker-build.yml'

permissions:
  contents: read
  security-events: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build & Scan Images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - context: backend
            dockerfile: backend/Dockerfile
            image: svai-backend
          - context: chatbot_service
            dockerfile: chatbot_service/Dockerfile
            image: svai-chatbot
          - context: frontend
            dockerfile: frontend/Dockerfile.frontend
            image: svai-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v3.10.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v6.15.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.image }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: 'sarif'
          output: 'trivy-${{ matrix.image }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.1.1
        continue-on-error: true
        with:
          sarif_file: 'trivy-${{ matrix.image }}.sarif'

      - name: Push to GHCR (main branch only) with versioned tags
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA7="${{ github.sha }}" && SHA7="${SHA7:0:7}"
          DATE_TAG="$(date +'%Y%m%d')-${SHA7}"
          IMG="ghcr.io/${REPO_LOWER}/${{ matrix.image }}"
          docker tag ${{ matrix.image }} "${IMG}:latest"
          docker tag ${{ matrix.image }} "${IMG}:${SHA7}"
          docker tag ${{ matrix.image }} "${IMG}:${DATE_TAG}"
          docker push "${IMG}:latest"
          docker push "${IMG}:${SHA7}"
          docker push "${IMG}:${DATE_TAG}"
          # Keep only last 10 tags per image
          TAGS=$(docker images --filter=reference="${IMG}" --format "{{.Tag}}" | sort -r | tail -n +11)
          for TAG in $TAGS; do
            docker rmi "${IMG}:${TAG}" 2>/dev/null || true
          done

      - name: Install cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v3.8.1

      - name: Sign image with cosign keyless
        if: github.ref == 'refs/heads/main'
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMG="ghcr.io/${REPO}/${{ matrix.image }}"
          cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "sha=${{ github.sha }}" \
            "${IMG}:latest"
          echo "✅ Signed ${IMG}:latest"
