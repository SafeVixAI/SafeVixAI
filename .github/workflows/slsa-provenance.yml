# SLSA Provenance attestation for release artifacts
name: SLSA Provenance

on:
  workflow_call:
    inputs:
      artifact-path:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SLSA3 provenance
        uses: slsa-framework/slsa-github-generator@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a  # v2.1.0
        with:
          artifact-source: "${{ inputs.artifact-path || github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          artifact-name: "${{ inputs.artifact-name || 'release-artifacts' }}"

  container-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      id-token: write
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest container provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v1.6.0
        with:
          subject-path: ghcr.io/${{ github.repository }}/*

      - name: Verify attestation
        run: |
          gh attestation verify \
            --repo ${{ github.repository }} \
            ghcr.io/${{ github.repository }}/backend:latest 2>&1 | head -5

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [attest, container-attest]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'SLSA Provenance'
      job-name: container-attest
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

