name: OWASP ZAP Scan

on:
  schedule:
    - cron: '0 4 * * 0' # Every Sunday at 4 AM UTC
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan'
        required: true
        default: 'https://app.safevixai.com'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ZAP Scan
        uses: zaproxy/action-full-scan@0f8503472afc3d03963d42a593629622d1a8c13b  # v0.11.0
        with:
          target: ${{ github.event.inputs.target_url || 'https://app.safevixai.com' }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -T 5'
          issue_title: 'OWASP ZAP Security Scan'
          fail_action: true
          allow_issue_writing: true

      - name: Upload ZAP report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: zap-report
          path: zap_*.html
          retention-days: 90

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [zap-scan]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'OWASP ZAP Scan'
      job-name: zap-scan
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

