name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-commits:
    name: Validate Signed Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify HEAD commit is signed
        run: |
          COMMIT_SIGNATURE=$(git verify-commit HEAD 2>&1 || true)
          if echo "$COMMIT_SIGNATURE" | grep -q "gpg: Signature made"; then
            echo "✅ HEAD commit is signed"
          else
            echo "❌ HEAD commit is NOT signed (or git verify-commit not available)"
            echo "::warning::Release tags should be from signed commits — continuing"
            echo "To enforce, set up GPG signing: https://docs.github.com/en/authentication/managing-commit-signature-verification/signing-commits"
          fi

  validate:
    needs: [validate-commits]
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.parse.outputs.version }}
      channel: ${{ steps.parse.outputs.channel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          fetch-depth: 0

      - name: Parse tag
        id: parse
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          if [[ "$TAG" == *"-"* ]]; then
            echo "channel=prerelease" >> $GITHUB_OUTPUT
          else
            echo "channel=stable" >> $GITHUB_OUTPUT
          fi

      - name: Validate VERSION file matches tag
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '\n\r')
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: VERSION file ($FILE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

  test:
    name: Test Suite
    needs: [validate]
    timeout-minutes: 30
    uses: ./.github/workflows/backend.yml
    secrets: inherit

  lint:
    name: Lint & Type Check
    needs: [validate]
    timeout-minutes: 30
    uses: ./.github/workflows/frontend.yml
    secrets: inherit

  sbom:
    name: Generate SBOM
    needs: [validate]
    timeout-minutes: 30
    uses: ./.github/workflows/security.yml
    secrets: inherit

  license-scan:
    name: License Compliance Check
    needs: [validate]
    timeout-minutes: 30
    uses: ./.github/workflows/license-scan.yml
    secrets: inherit

  build:
    name: Build & Push Images
    needs: [validate, test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    strategy:
      matrix:
        service:
          - { name: backend, context: backend, dockerfile: backend/Dockerfile }
          - { name: chatbot, context: chatbot_service, dockerfile: chatbot_service/Dockerfile }
          - { name: frontend, context: frontend, dockerfile: frontend/Dockerfile.frontend }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v6.15.0
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v1.6.0
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  sign:
    name: Sign Container Images
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        name: [backend, chatbot, frontend]
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v3.8.1

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO}/${{ matrix.name }}" >> $GITHUB_OUTPUT

      - name: Sign image with cosign keyless
        run: |
          cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ github.ref }}" \
            -a "sha=${{ github.sha }}" \
            "${{ steps.tag.outputs.image }}:v${{ needs.validate.outputs.version }}"

      - name: Verify signature
        run: |
          cosign verify --insecure-ignore-tlog \
            "${{ steps.tag.outputs.image }}:v${{ needs.validate.outputs.version }}"

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [validate-commits, validate, test, lint, sbom, license-scan, build, sign, create-release]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'Release'
      job-name: create-release
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  create-release:
    name: Create GitHub Release
    needs: [validate, build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Generate release notes
        id: notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const version = '${{ needs.validate.outputs.version }}';
            const section = changelog.match(
              new RegExp(`## \\[${version}\\] - [\\d-]+\\n\\n([\\s\\S]*?)(?=\\n## \\[|\\n\\[Unreleased\\])`)
            );
            return section ? section[1].trim() : 'See CHANGELOG.md for details.';

      - name: Download SBOM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4.6.1
        with:
          path: sbom-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v2.2.1
        with:
          name: v${{ needs.validate.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.result }}
          files: |
            sbom-artifacts/**/*
          prerelease: ${{ needs.validate.outputs.channel == 'prerelease' }}
          generate_release_notes: false
