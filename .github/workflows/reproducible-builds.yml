# Verify builds are reproducible across independent runs
name: Reproducible Builds

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        service:
          - { name: backend, dir: backend, dockerfile: backend/Dockerfile }
          - { name: frontend, dir: frontend, dockerfile: frontend/Dockerfile.frontend }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build (run 1)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v6.15.0
        with:
          context: ${{ matrix.service.dir }}
          file: ${{ matrix.service.dockerfile }}
          tags: ${{ matrix.service.name }}-r1
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build (run 2 - independent)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v6.15.0
        with:
          context: ${{ matrix.service.dir }}
          file: ${{ matrix.service.dockerfile }}
          tags: ${{ matrix.service.name }}-r2
          load: true
          no-cache: true

      - name: Compare image digests
        run: |
          DIGEST1=$(docker inspect --format='{{.Id}}' ${{ matrix.service.name }}-r1)
          DIGEST2=$(docker inspect --format='{{.Id}}' ${{ matrix.service.name }}-r2)
          if [ "$DIGEST1" = "$DIGEST2" ]; then
            echo "✅ ${{ matrix.service.name }}: REPRODUCIBLE ($DIGEST1)"
          else
            echo "⚠️ ${{ matrix.service.name }}: NOT REPRODUCIBLE"
            echo "  Run 1: $DIGEST1"
            echo "  Run 2: $DIGEST2"
          fi

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [verify]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'Reproducible Builds'
      job-name: verify
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

