      - Memory: architecture/MEMORY.md
      - Security: architecture/SECURITY.md
      - Threat Model: architecture/THREAT_MODEL.md
      - Authentication: architecture/AUTHENTICATION.md
      - Authorization: architecture/AUTHORIZATION.md
  - API Reference:
      - SDK Guide: api-reference/SDK_GUIDE.md
      - CLI Reference: api-reference/CLI_REFERENCE.md
      - API Routes: api-reference/API.md
      - Webhooks: api-reference/WEBHOOKS.md
      - Integrations: api-reference/THIRD_PARTY_INTEGRATIONS.md
