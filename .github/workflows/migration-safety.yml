name: Migration Safety Check

on:
  push:
    branches: [main]
    paths: ['backend/migrations/versions/**', 'backend/models/**']
  pull_request:
    branches: [main]
    paths: ['backend/migrations/versions/**', 'backend/models/**']
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  migration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: safevixai_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/safevixai_migration_test
      ENVIRONMENT: test
      ADMIN_SECRET: migration-check-secret

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.5.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Enable PostGIS extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d safevixai_migration_test -c "CREATE EXTENSION IF NOT EXISTS postgis;" -c "CREATE EXTENSION IF NOT EXISTS postgis_topology;"

      - name: Run migrations
        working-directory: backend
        run: |
          alembic upgrade head 2>&1
          alembic check 2>&1

      - name: Verify downgrade cycle
        working-directory: backend
        run: |
          CURRENT_BEFORE=$(alembic current 2>&1)
          alembic downgrade -1 2>&1 && echo "Downgrade OK" || echo "Downgrade skipped (base)"
          alembic upgrade head 2>&1 && echo "Re-upgrade OK"
          echo "Current after: $(alembic current 2>&1)"

      - name: Verify no duplicate revision IDs
        working-directory: backend
        run: |
          DUPES=$(grep -h 'revision\s*=' migrations/versions/*.py 2>/dev/null | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "DUPLICATE revision IDs:"
            echo "$DUPES"
            exit 1
          fi
          TOTAL=$(grep -h 'revision\s*=' migrations/versions/*.py 2>/dev/null | wc -l)
          echo "All $TOTAL revision IDs unique"
