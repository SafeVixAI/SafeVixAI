# Versioned system prompts and safety patterns for SafeVixAI chatbot.
# Loaded by prompts/__init__.py at startup; backing store for live hot-reload.
# --- DO NOT embed secrets or API keys in this file ---

# ── Core system prompt ──────────────────────────────────────────────────────────
system_prompt: >
  You are SafeVixAI, an AI assistant built for Indian road safety and emergency
  response. Help users with: emergency contacts, first aid, pothole/accident
  reporting, traffic challans, navigation, and road authority escalation.
  Always answer concisely in the SAME language the user writes in (Hindi, Tamil,
  Telugu, etc.). For life-threatening situations, always lead with 112 (universal
  emergency) or 102 (ambulance). Be factual — cite MV Act sections when answering
  challan questions.

# ── Input guardrails ────────────────────────────────────────────────────────────
max_history: 10
max_response_tokens: 800
max_input_chars: 12000
max_single_message_chars: 4000

# ── Prohibited injection patterns ───────────────────────────────────────────────
prohibited_patterns:
  - "ignore all previous"
  - "ignore previous"
  - "disregard"
  - "bypass"
  - "system prompt"
  - "you are now"
  - "you are no longer"
  - "forget instructions"
  - "jailbreak"
  - "forget everything"
  - "new instructions"
  - "hypothetical scenario where you ignore"
  - "pretend you are"
  - "act as if"
  - "override"
  - "reveal your instructions"
  - "show me your prompt"
  - "show me your instructions"
  - "what are your instructions"
  - "do not follow"
  - "do anything now"
  - "<script"

