name: Load Test

on:
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 8 AM UTC
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Base URL to test against'
        required: true
        default: 'https://api.safevixai.com'
      vu_count:
        description: 'Max virtual users'
        required: true
        default: '100'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  k6-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run k6 smoke test
        uses: grafana/k6-action@e4714b734f2b0afaabeb7b4a69142745548ab9ec  # v0.3.1
        with:
          filename: load-testing/k6/smoke.test.js
          flags: --quiet --summary-export=results.json
        env:
          API_BASE_URL: ${{ github.event.inputs.target_url || 'https://api.safevixai.com' }}
          CHATBOT_BASE_URL: ${{ github.event.inputs.target_url || 'https://api.safevixai.com' }}

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: k6-results
          path: results.json
          retention-days: 30

  k6-load:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run k6 load test
        uses: grafana/k6-action@e4714b734f2b0afaabeb7b4a69142745548ab9ec  # v0.3.1
        with:
          filename: load-testing/k6/main.test.js
          flags: --quiet
        env:
          API_BASE_URL: ${{ github.event.inputs.target_url }}
          CHATBOT_BASE_URL: ${{ github.event.inputs.target_url }}

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: k6-load-results
          path: results.json
          retention-days: 30

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [k6-smoke, k6-load]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'Load Test'
      job-name: k6-load
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

