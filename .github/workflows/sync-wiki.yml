name: Wiki Documentation Sync

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Wiki manager mode'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - check
          - fix
          - generate
          - update

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  wiki-sync:
    name: Update Wiki Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.5.0
        with:
          python-version: '3.11'

      - name: Lint hand-written markdown
        uses: DavidAnson/markdownlint-cli2-action@b4c9feab76d8025d1e83c653fa3990936df0e6c8  # v16.1.0
        continue-on-error: true
        with:
          globs: |
            docs/*.md
            *.md
            !docs/wiki/**/*
            !node_modules/**/*
          config: |
            {
              "MD013": false,
              "MD024": false,
              "MD033": false,
              "MD041": false
            }

      - name: Run wiki manager
        continue-on-error: true
        env:
          # Primary: GitHub Models (free via Student Developer Pack)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fallbacks (set as GitHub Secrets)
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Email alerts on failure (optional)
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          echo "=== Running wiki_manager.py in '$MODE' mode ==="
          python scripts/docs/wiki_manager.py "$MODE" || echo "wiki_manager.py exited with code $?"

      - name: Post-run integrity check
        continue-on-error: true
        run: |
          echo "=== Wiki Integrity Report ==="
          CONTENT_COUNT=$(find docs/wiki/content -name "*.md" | wc -l)
          echo "Wiki content files: $CONTENT_COUNT"
          python scripts/docs/wiki_manager.py check --strict

      - name: Check for broken external links
        continue-on-error: true
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621  # v1.10.0
        with:
          args: >
            --no-progress
            --exclude-mail
            --exclude 'file://'
            --exclude 'https://github.com/SafeVixAI/SafeVixAI'
            './docs/wiki/**/*.md'
            './docs/*.md'
            './*.md'
          fail: false

      - name: Validate code examples in wiki
        continue-on-error: true
        run: python scripts/docs/test-code-examples.py

      - name: Check internal links resolve
        continue-on-error: true
        run: python scripts/docs/check-links.py

      - name: Generate docs health dashboard
        run: python scripts/docs/generate-health-dashboard.py

      - name: Create Pull Request for Wiki Updates
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7.0.7
        with:
          commit-message: "docs(wiki): auto-sync wiki documentation [automated]"
          title: "docs(wiki): Auto-sync Wiki Documentation"
          body: |
            Automated synchronization of wiki documentation files generated by `wiki_manager.py`.

            **Review required before merge.** Changes affect: docs/wiki/, docs/*.md, AGENTS.md, README.md, DESIGN.md, SETUP.md, SKILL.md.

            - [ ] Verify no stale references or outdated content (>90 days)
            - [ ] Check mermaid diagrams render correctly
            - [ ] Confirm glossary terms are used consistently
            - [ ] Verify code examples are valid (Python/TS/Bash)
            - [ ] Check internal links resolve to existing files
            - [ ] Verify no hallucinated API routes or env vars
          branch: "docs-wiki-auto-update"
          base: "main"
          add-paths: |
            docs/wiki/**
            docs/*.md
            AGENTS.md
            README.md
            DESIGN.md
            SETUP.md
            SKILL.md

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [wiki-sync]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'Wiki Documentation Sync'
      job-name: wiki-sync
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

