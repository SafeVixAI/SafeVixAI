name: Documentation Validation

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.markdownlint.json'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.markdownlint.json'

jobs:
  validate-markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  validate-links:
    name: Broken Link Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  validate-mermaid:
    name: Mermaid Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate Mermaid Diagrams
        run: |
          echo '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' > puppeteer-config.json
          find . -name "*.md" -type f -not -path "*/node_modules/*" -not -path "*/.next/*" | while read file; do
            if grep -q "\`\`\`mermaid" "$file"; then
              echo "Validating mermaid in $file"
              npx --yes @mermaid-js/mermaid-cli@11.4.2 -p puppeteer-config.json -i "$file" -o "${file%.md}.svg" || exit 1
              rm -f "${file%.md}"*.svg
            fi
          done

  build-mkdocs:
    name: MkDocs Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'mkdocs-requirements.txt'
      - name: Install MkDocs Dependencies
        run: pip install --require-hashes -r mkdocs-requirements.txt
      - name: Build Docs
        run: mkdocs build
