name: Secrets Rotation

on:
  schedule:
    - cron: '0 2 1 * *' # First day of every month at 2 AM UTC
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to rotate (backend, chatbot, infra)'
        required: false
        default: ''
      key:
        description: 'Specific key to rotate'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  rotate:
    runs-on: ubuntu-latest

    if: github.repository == 'SafeVixAI/SafeVixAI'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.5.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install PyYAML

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Rotate secrets
        run: |
          args="--ci"
          if [ -n "${{ github.event.inputs.service }}" ]; then
            args="$args --service ${{ github.event.inputs.service }}"
          fi
          if [ -n "${{ github.event.inputs.key }}" ]; then
            args="$args --key ${{ github.event.inputs.key }}"
          fi
          python scripts/rotate-secrets.py $args

      - name: Upload rotation log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rotation-log
          path: rotation-log-*.json
          retention-days: 90

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [rotate]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'Secrets Rotation'
      job-name: rotate
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

