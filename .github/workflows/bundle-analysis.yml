name: Bundle Analysis

on:
  pull_request:
    branches: [main]
    paths: ['frontend/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Analyze bundle size
        working-directory: frontend
        run: node scripts/bundle-analysis.mjs

      - name: Comment PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const buildDir = path.join(process.cwd(), '.next', 'static', 'chunks');
            const appDir = path.join(buildDir, 'app');
            const chunks = [];

            function collect(dir) {
              if (!fs.existsSync(dir)) return;
              for (const f of fs.readdirSync(dir)) {
                const fp = path.join(dir, f);
                if (f.endsWith('.js')) {
                  const size = fs.statSync(fp).size;
                  chunks.push({ name: path.relative(process.cwd(), fp), size });
                }
              }
            }
            collect(buildDir);
            collect(appDir);
            chunks.sort((a, b) => b.size - a.size);

            let table = '## Bundle Size Report\n\n| Chunk | Size |\n|------|------|\n';
            for (const c of chunks.slice(0, 20)) {
              const sizeKB = (c.size / 1024).toFixed(1);
              table += `| \`${c.name}\` | ${sizeKB} kB |\n`;
            }
            const totalKB = (chunks.reduce((s, c) => s + c.size, 0) / 1024).toFixed(1);
            table += `\n**Total: ${totalKB} kB** (${chunks.length} chunks)`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: table,
            });

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [bundle-size]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'Bundle Analysis'
      job-name: bundle-size
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
