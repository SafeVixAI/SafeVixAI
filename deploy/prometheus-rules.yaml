# deploy/prometheus-rules.yaml
# Alerting rules for SafeVixAI production monitoring
groups:
  - name: safevixai_alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          (sum(rate(http_requests_duration_seconds_count{status_code=~"5.."}[5m]))
           /
           sum(rate(http_requests_duration_seconds_count[5m])) > 0.05)
        for: 5m
        labels: { severity: critical, team: backend }
        annotations:
          summary: "High error rate ({{ $value | humanizePercentage }})"
          description: "Error rate on {{ $labels.service }} is {{ $value | humanizePercentage }} for 5m"

      - alert: HighLatency
        expr: histogram_quantile(0.99, sum(rate(http_requests_duration_seconds_bucket[5m])) by (le, service, endpoint)) > 2
        for: 5m
        labels: { severity: warning, team: backend }
        annotations:
          summary: "p99 latency {{ $value | humanizeDuration }} on {{ $labels.endpoint }}"

      - alert: CircuitBreakerOpen
        expr: safevixai_circuit_breaker_state{state="open"} == 1
        for: 1m
        labels: { severity: critical, team: backend }
        annotations:
          summary: "Circuit breaker OPEN for {{ $labels.service_name }}"

      - alert: DBConnectionPoolExhaustion
        expr: |
          (pg_stat_activity_count{datname=~"safevixai.*"} 
           / ignoring(datname) pg_settings_max_connections) > 0.8
        for: 5m
        labels: { severity: critical, team: backend }
        annotations:
          summary: "DB pool near exhaustion ({{ $value | humanizePercentage }})"

      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / process_virtual_memory_bytes) > 0.8
        for: 5m
        labels: { severity: warning, team: backend }
        annotations:
          summary: "Memory >80% on {{ $labels.service }}"

      - alert: CertificateExpiry
        expr: (certmanager_certificate_expiration_seconds - time()) / 86400 < 30
        for: 1h
        labels: { severity: warning, team: infrastructure }
        annotations:
          summary: "TLS cert expires in {{ $value | humanizeDuration }}"

      - alert: SOSEndpointFailures
        expr: sum(increase(http_requests_duration_seconds_count{endpoint=~"/api/v1/sos.*",status_code=~"5.."}[5m])) > 3
        for: 1m
        labels: { severity: critical, team: backend }
        annotations:
          summary: "SOS endpoint failures >3 in 5m"

      - alert: HealthCheckDown
        expr: probe_success{job="safevixai"} == 0
        for: 1m
        labels: { severity: critical, team: devops }
        annotations:
          summary: "Health check FAILED for {{ $labels.instance }}"
