# License compliance scanning for all dependencies
name: License Scan

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.5.0
        with:
          python-version: '3.11'

      - name: Check Python dependency licenses
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pip-licenses
          pip-licenses --format=json --with-authors --with-urls --with-description \
            > ../backend-licenses.json
          pip-licenses --format=markdown --with-authors --with-urls \
            > ../backend-LICENSES.md

      - name: Fail on restricted licenses
        working-directory: backend
        run: |
          pip install pip-licenses
          pip-licenses --format=json \
            | python -c "
          import json, sys
          deps = json.load(sys.stdin)
          restricted = {'GPL', 'GPLv2', 'GPLv3', 'AGPL', 'AGPLv3', 'LGPLv3', 'BUSL-1.1'}
          bad = {d['Name'] for d in deps if d['License'] in restricted}
          if bad:
            print(f'RESTRICTED LICENSES FOUND: {bad}')
            sys.exit(1)
          print('All backend dependencies pass license check')
          "

  chatbot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.5.0
        with:
          python-version: '3.11'

      - name: Check Python dependency licenses
        working-directory: chatbot_service
        run: |
          if [ -f requirements-render.txt ]; then
            pip install -r requirements-render.txt
          else
            pip install -r requirements.txt
          fi
          pip install pip-licenses
          pip-licenses --format=json --with-authors --with-urls \
            > ../chatbot-licenses.json
          pip-licenses --format=markdown --with-authors --with-urls \
            > ../chatbot-LICENSES.md

      - name: Fail on restricted licenses
        working-directory: chatbot_service
        run: |
          pip install pip-licenses
          pip-licenses --format=json \
            | python -c "
          import json, sys
          deps = json.load(sys.stdin)
          restricted = {'GPL', 'GPLv2', 'GPLv3', 'AGPL', 'AGPLv3', 'LGPLv3', 'BUSL-1.1'}
          bad = {d['Name'] for d in deps if d['License'] in restricted}
          if bad:
            print(f'RESTRICTED LICENSES FOUND: {bad}')
            sys.exit(1)
          print('All chatbot dependencies pass license check')
          "

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check npm dependency licenses
        continue-on-error: true
        working-directory: frontend
        run: |
          npx license-checker --json --production \
            --excludePrivatePackages --relativeLicensePath \
            > ../frontend-licenses.json 2>&1 || echo "npm license-checker failed (non-blocking)"
          npx license-checker --summary --production \
            > ../frontend-LICENSES.md 2>&1 || echo "npm license-checker summary failed (non-blocking)"

      - name: Upload license reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: license-reports
          path: |
            *-licenses.json
            *-LICENSES.md
          retention-days: 90

  notify-failure:
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [backend, chatbot, frontend]
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: 'License Scan'
      job-name: frontend
      run-id: ${{ github.run_id }}
      conclusion: failure
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

